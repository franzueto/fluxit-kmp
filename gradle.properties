org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3g

# --- Firebase emulator endpoints (FB-006) -----------------------------------
# Single source of truth for the emulator host/ports the Android and iOS
# clients connect to. Values are generated into a shared Kotlin config object
# at build time, so Android (FB-006) and iOS (FB-007) read the same numbers.
#
# Override per developer without editing this file:
#   ~/.gradle/gradle.properties, a gitignored local gradle.properties, an
#   ORG_GRADLE_PROJECT_* environment variable, or -P on the command line, e.g.
#   ./gradlew :composeApp:assembleDebug -Pfluxit.firebase.emulator.enabled=true \
#       -Pfluxit.firebase.emulator.firestore.port=8580
#
# The Firestore default stays 8080 only because firebase.json and the FB-005
# Rules suite pin it; 8080 is collision-prone (Tomcat, Spring Boot, adb proxies,
# many local dev servers), so override it whenever it clashes. If the default
# is ever moved, firebase.json and firebase/test/helpers.js must move with it.
fluxit.firebase.emulator.enabled=false
fluxit.firebase.emulator.host=127.0.0.1
fluxit.firebase.emulator.auth.port=9099
fluxit.firebase.emulator.firestore.port=8080
fluxit.firebase.emulator.storage.port=9199

# --- Firebase repository dev flag (FB-207) -----------------------------------
# Temporary development-only switch: when true, each `actual platformModule()`
# binds the Firebase list/item repositories (FB-202-FB-205) instead of Room.
# Default stays false so production/default builds keep the Room bindings
# unchanged; this is NOT the production cutover (that is a later, separate
# task per FIREBASE_MIGRATION_PLAN.md's Phase 7 - "Switch the production Koin
# bindings to Firebase"). Override the same way as the emulator properties
# above, e.g. -Pfluxit.firebase.repositories.enabled=true. Typically combined
# with fluxit.firebase.emulator.enabled=true for manual/emulator testing.
fluxit.firebase.repositories.enabled=false
