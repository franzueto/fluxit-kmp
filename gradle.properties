org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3g

# --- Firebase emulator endpoints -----------------------------------
# Single source of truth for the emulator host/ports the Android and iOS
# clients connect to. Values are generated into a shared Kotlin config object
# at build time, so Android and iOS read the same numbers.
#
# Override per developer without editing this file:
#   ~/.gradle/gradle.properties, a gitignored local gradle.properties, an
#   ORG_GRADLE_PROJECT_* environment variable, or -P on the command line, e.g.
#   ./gradlew :composeApp:assembleDebug -Pfluxit.firebase.emulator.enabled=true \
#       -Pfluxit.firebase.emulator.firestore.port=8580
#
# The Firestore default stays 8080 only because firebase.json and the 
# Rules suite uses it; 8080 is collision-prone (Tomcat, Spring Boot, adb proxies,
# many local dev servers), so override it whenever it clashes. If the default
# is ever moved, firebase.json must move with it. The Rules helpers read that
# file, and firebase's npm run check verifies these defaults still agree.
fluxit.firebase.emulator.enabled=false
fluxit.firebase.emulator.host=127.0.0.1
fluxit.firebase.emulator.auth.port=9099
fluxit.firebase.emulator.firestore.port=8080
fluxit.firebase.emulator.storage.port=9199

# Repository selection is unconditional Firebase in both platform modules.
# The retired fluxit.firebase.repositories.enabled property no longer selects Room.

# Kotlin/Wasm (web client): Kotlin 2.3.20's incremental klib compile crashes on any edit
# after the first build (ArrayIndexOutOfBoundsException in WasmIrFileMetadata). The JS/Wasm
# compile is incremental if either flag is on, so both are off. Affects only the wasmJs
# target (there is no JS target). Revisit when Kotlin is upgraded.
kotlin.incremental.js.klib=false
kotlin.incremental.js=false
