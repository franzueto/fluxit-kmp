name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-unit:
    name: Android unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # The real google-services.json is gitignored and never available to CI. The Google
      # Services plugin only needs a well-formed file for the com.fluxit package; the unit
      # tests use fakes and never contact Firebase, so a fake demo-project config is enough.
      - name: Install placeholder Firebase config
        run: cp .github/ci/placeholder-google-services.json composeApp/google-services.json
      - name: Debug and Release unit tests
        run: ./gradlew :composeApp:testDebugUnitTest :composeApp:testReleaseUnitTest --no-daemon

  rules:
    name: Firestore and Storage Rules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - run: npm ci
      - name: Config checks and Rules tests (demo-fluxit emulators)
        run: npm test

  functions:
    name: Cloud Functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - name: Build and unit tests
        run: npm run check
